# X670 stock Android boot image v2 layout, from the device's unpacked boot image.
[uefi_fd]
base = 0x40080000
size = 0x200000

[boot_shim]
requires_kernel_header = true
text_offset = 0x80000
image_size = 0x202000
flags = 0xa

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = false

[boot_image]
base           = 0x40078000
cmdline        = "bootopt=64S3,32N2,64N2"
dtb            = "Resources/DTBs/x670.dtb"
dtb_offset     = 0x0BC08000
header_version = 2
kernel_offset  = 0x00008000
ramdisk_offset = 0x07C08000
second_offset  = 0xBFF88000
tags_offset    = 0x0BC08000
